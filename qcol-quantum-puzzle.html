<!-- ============================================================
     🔄 INICIALIZACIÓN GLOBAL - SUPABASE SYNC
     ============================================================ -->
<script>
// Cargar configuración y módulo de forma dinámica
(async function initQuantumSync() {
    try {
        const { SUPABASE_CONFIG } = await import('./supabase-config.js');
        const { default: QuantumSync } = await import('./quantum-sync.js');
        
        console.log('📦 Módulos importados correctamente');
        console.log('📌 SUPABASE_CONFIG:', SUPABASE_CONFIG);
        
        window.quantumSync = new QuantumSync({
            supabaseUrl: SUPABASE_CONFIG.supabaseUrl,
            supabaseAnonKey: SUPABASE_CONFIG.supabaseAnonKey,
            supabaseServiceKey: SUPABASE_CONFIG.supabaseServiceKey
        });
        
        console.log('📌 quantumSync creado:', window.quantumSync);
        await window.quantumSync.init();
        
        console.log('📌 quantumSync.isReady:', window.quantumSync.isReady);
        
        window.quantumSync.setUser({
            id: 'usuario-123',
            name: 'Admin',
            role: 'founder'
        });
        
        // ✅ Callbacks con DEBOUNCE para evitar parpadeo
        let renderTimer = null;
        let pendingRenderTimer = null;
        let publishedRenderTimer = null;
        
        window.quantumSync.onPendingUpdate = (apps) => {
            console.log('📋 Apps pendientes actualizadas:', apps.length);
            clearTimeout(pendingRenderTimer);
            pendingRenderTimer = setTimeout(() => {
                if (typeof window.renderPendingList === 'function') {
                    window.renderPendingList();
                }
            }, 300);
        };
        
        window.quantumSync.onPublishedUpdate = (apps) => {
            console.log('📦 Apps publicadas actualizadas:', apps.length);
            clearTimeout(publishedRenderTimer);
            publishedRenderTimer = setTimeout(() => {
                if (typeof window.renderTagFilters === 'function') {
                    window.renderTagFilters();
                }
                if (typeof window.renderPublishedApps === 'function') {
                    window.renderPublishedApps();
                }
            }, 300);
        };
        
        window.quantumSync.onAppPublished = (app) => {
            window.showNotification(`✅ "${app.title}" publicado en la nube`);
        };
        
        window.quantumSync.onAppRejected = (appId) => {
            window.showNotification('🗑️ App rechazada en la nube');
        };
        
        // ✅ Sincronización automática cuando la página se vuelve visible
        document.addEventListener('visibilitychange', async () => {
            if (!document.hidden && window.quantumSync && window.quantumSync.isReady) {
                console.log('🔄 Página visible, sincronizando...');
                await window.quantumSync.syncAll(true);
                renderTagFilters();
                renderPublishedApps();
                renderPendingList();
            }
        });
        
        window.quantumSync.connectPuzzle();
        
        console.log('✅ Quantum Sync inicializado correctamente');
        console.log('✅ quantumSync.isReady:', window.quantumSync.isReady);
        
        // ✅ Sincronización inicial - SOLO UNA VEZ
        let initialSyncDone = false;
        setTimeout(async () => {
            if (!initialSyncDone && window.quantumSync && window.quantumSync.isReady) {
                initialSyncDone = true;
                await window.quantumSync.syncAll(true);
                renderTagFilters();
                renderPublishedApps();
                renderPendingList();
                console.log('✅ Sincronización inicial completada');
            }
        }, 300);
        
    } catch (error) {
        console.error('❌ Error inicializando Quantum Sync:', error);
        console.error('Detalles:', error.message);
        window.showNotification('❌ Error de conexión con Supabase. Modo offline.');
    }
})();
</script>

function escapeHtml(str) {
    if(!str) return '';
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
}

function extractUniqueTags(apps) {
    const tagsSet = new Set();
    apps.forEach(app => {
        (app.tags || '').split(',').forEach(t => { let tt = t.trim().toLowerCase(); if(tt) tagsSet.add(tt); });
    });
    return Array.from(tagsSet);
}

// Listen for pyCall from execIframe and execute them remotely
window.addEventListener('message', async function _execPyCallHandler(ev) {
    const d = ev.data;
    if (!d || d.type !== 'pyCall') return;
    const { id, func, args, serverUrl: appUrl, pythonCode } = d;
    const src = ev.source;

    const tid = setTimeout(() => {
        _execPyCalls.delete(id);
        try { src.postMessage({ type: 'pyResult', id, error: 'Timeout 35s' }, '*'); } catch(e) {}
    }, 35000);
    _execPyCalls.set(id, { src, tid });

    const serverUrl = appUrl || compilerUrl || localStorage.getItem('qcol_colab_url') || '';
    try {
        if (!serverUrl) throw new Error('No server URL. Configure it in the Founder Panel.');
        const callCode = (pythonCode ? pythonCode + '\n\n' : '') +
            'import json as _json\n' +
            '_args = _json.loads(' + JSON.stringify(JSON.stringify(args)) + ')\n' +
            '_result = ' + func + '(*_args)\n' +
            'print(_json.dumps(_result, ensure_ascii=False, default=str))';
        const output = await _runPythonRemote(callCode, serverUrl);
        clearTimeout(tid); _execPyCalls.delete(id);
        let parsed = (output || '').trim();
        try { parsed = JSON.parse(parsed); } catch(e) {}
        src.postMessage({ type: 'pyResult', id, result: parsed }, '*');
    } catch(err) {
        clearTimeout(tid); _execPyCalls.delete(id);
        src.postMessage({ type: 'pyResult', id, error: err.message }, '*');
    }
});

async function _runPythonRemote(code, serverUrl) {
    const base = (serverUrl || '').replace(/\/+$/, '');
    if (!base) throw new Error('No quantum server URL configured');
    const isHF  = base.includes('hf.space') || base.includes('huggingface');
    const url   = base + (isHF ? '/run/predict' : '/run');
    const body  = isHF
        ? JSON.stringify({ data: [code], fn_index: 1 })
        : JSON.stringify({ code });
    const res   = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
    const raw = await res.json();
    const out = isHF ? (raw.data?.[0] ?? raw) : raw;
    if (out?.success === false) throw new Error(out.output || out.error || 'Server error');
    return out?.output ?? out?.result ?? String(out ?? '');
}

function _buildAppBlob(pythonCode, htmlCode, serverUrl) {
    const bridge = `<script>
(function(){
    window.__serverUrl  = ${JSON.stringify(serverUrl  || '')};
    window.__pyCode     = ${JSON.stringify(pythonCode || '')};
    window.pyCall = function(funcName) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function(resolve, reject) {
            var msgId = Date.now() + '-' + Math.random().toString(36).slice(2);
            function handler(ev) {
                var d = ev.data;
                if (d && d.type === 'pyResult' && d.id === msgId) {
                    window.removeEventListener('message', handler);
                    if (d.error) reject(new Error(d.error));
                    else resolve(d.result);
                }
            }
            window.addEventListener('message', handler);
            window.parent.postMessage({
                type: 'pyCall', id: msgId, func: funcName, args: args,
                serverUrl: window.__serverUrl, pythonCode: window.__pyCode
            }, '*');
        });
    };
})();
<\/script>`;

    let html = htmlCode || '<!DOCTYPE html><html><body><h2>⚛️ App without interface</h2></body></html>';
    if (html.includes('</head>'))        html = html.replace('</head>', bridge + '</head>');
    else if (html.includes('<body'))      html = html.replace('<body', bridge + '<body');
    else if (html.includes('<html'))      html = html.replace('<html>', '<html>' + bridge);
    else                                  html = bridge + html;

    return URL.createObjectURL(new Blob([html], { type: 'text/html' }));
}

function executeWithStudio(app) {
    const loadingDiv = document.getElementById('execLoading');
    const iframe     = document.getElementById('execIframe');

    loadingDiv.style.display = 'flex';

    const serverUrl = app.server_url || app.serverUrl || compilerUrl || localStorage.getItem('qcol_colab_url') || '';

    // ✅ Verificación mejorada
    if (!app.python_code && !app.html_code && !app.pythonCode && !app.htmlCode) {
        loadingDiv.style.display = 'none';
        showNotification('⚠️ This app has no HTML or Python code. Edit it in Studio first.');
        return;
    }

    if (window._execBlobUrl) { URL.revokeObjectURL(window._execBlobUrl); }

    try {
        const pythonCode = app.python_code || app.pythonCode || '';
        const htmlCode = app.html_code || app.htmlCode || '';
        window._execBlobUrl = _buildAppBlob(pythonCode, htmlCode, serverUrl);
        iframe.src = window._execBlobUrl;
        iframe.onload = function() { loadingDiv.style.display = 'none'; };
        setTimeout(function() { if (loadingDiv.style.display !== 'none') loadingDiv.style.display = 'none'; }, 5000);
    } catch(err) {
        loadingDiv.style.display = 'none';
        showNotification('Error building app: ' + err.message);
    }
}

window.addEventListener('message', async function(e) {
    const data = e.data;
    if (!data || typeof data !== 'object') return;
    
    if (data.type === 'QCOL_STUDIO_SYNC_APP') {
        const { appId, appData } = data;
        
        if (window.quantumSync && window.quantumSync.isReady) {
            try {
                const result = await window.quantumSync.submitApp({
                    id: appData.id || appId,
                    name: appData.name || appData.title || 'Untitled',
                    title: appData.title || appData.name || 'Untitled',
                    description: appData.description || '',
                    tags: appData.tags || '',
                    pythonCode: appData.pythonCode || '',
                    htmlCode: appData.htmlCode || '',
                    serverUrl: appData.serverUrl || '',
                    duration: appData.duration || 8
                });
                
                showNotification(`☁️ App "${result.title}" sincronizada con la nube (pendiente)`);
                
                await window.renderPendingList();
                window.renderTagFilters();
                await window.renderPublishedApps();
                
                if (e.source) {
                    e.source.postMessage({
                        type: 'QCOL_STUDIO_SYNC_CONFIRMED',
                        appId: appId,
                        success: true,
                        title: result.title
                    }, e.origin);
                }
            } catch (error) {
                console.error('❌ Error sincronizando desde Studio:', error);
                showNotification('❌ Error al sincronizar: ' + error.message);
                
                if (e.source) {
                    e.source.postMessage({
                        type: 'QCOL_STUDIO_SYNC_CONFIRMED',
                        appId: appId,
                        success: false,
                        error: error.message
                    }, e.origin);
                }
            }
        } else {
            console.warn('⚠️ Quantum Sync no disponible, guardando localmente');
            const pending = JSON.parse(localStorage.getItem('qcol_pending_quantum_apps') || '[]');
            const existing = pending.find(p => p.id === appId);
            if (existing) {
                Object.assign(existing, appData);
            } else {
                pending.push(appData);
            }
            localStorage.setItem('qcol_pending_quantum_apps', JSON.stringify(pending));
            showNotification(`📦 App "${appData.title}" guardada localmente`);
            
            await window.renderPendingList();
            
            if (e.source) {
                e.source.postMessage({
                    type: 'QCOL_STUDIO_SYNC_CONFIRMED',
                    appId: appId,
                    success: true,
                    local: true
                }, e.origin);
            }
        }
    }
});

async function publishPendingApp(appId) {
    if (!isFounder && !isAdmin) { 
        showNotification("Solo fundadores/admins pueden publicar"); 
        return; 
    }
    
    if (!window.quantumSync || !window.quantumSync.isReady) {
        showNotification("❌ No hay conexión con la nube. Revisa la consola.");
        console.error('❌ quantumSync no disponible o no inicializado');

    }
    
    try {
        const published = await window.quantumSync.approveApp(appId, currentUser?.id);
        showNotification(`✅ App "${published.title}" publicada en la nube`);
        
        await window.quantumSync.syncPendingApps();
        await window.quantumSync.syncPublishedApps();
        
        await renderPendingList();
        renderTagFilters();
        await renderPublishedApps();
        
    } catch (error) {

        showNotification('❌ Error al publicar: ' + error.message);
    }
}

}
