     🔄 INICIALIZACIÓN GLOBAL - SUPABASE SYNC (SIN MODULE)
     ============================================================ -->
<script>
// Cargar configuración y módulo de forma dinámica
(async function initQuantumSync() {
    try {
        // Importar configuración y módulo
        const { SUPABASE_CONFIG } = await import('./supabase-config.js');
        const { default: QuantumSync } = await import('./qcol-cloud-sync.js');
        
        console.log('📦 Módulos importados correctamente');
        console.log('📌 SUPABASE_CONFIG:', SUPABASE_CONFIG);
        
        // Crear instancia global
        window.quantumSync = new QuantumSync({
            supabaseUrl: SUPABASE_CONFIG.supabaseUrl,
            supabaseAnonKey: SUPABASE_CONFIG.supabaseAnonKey,
            supabaseServiceKey: SUPABASE_CONFIG.supabaseServiceKey
        });
        
        console.log('📌 quantumSync creado:', window.quantumSync);
        
        // Inicializar la conexión
        await window.quantumSync.init();
        
        console.log('📌 quantumSync.isReady:', window.quantumSync.isReady);
        
        // Configurar usuario
        window.quantumSync.setUser({
            id: 'usuario-123',
            name: 'Admin',
            role: 'founder'
        });
        
        // Callbacks para actualizar la UI automáticamente
        window.quantumSync.onPendingUpdate = (apps) => {
            console.log('📋 Apps pendientes actualizadas:', apps.length);
            if (typeof window.renderPendingList === 'function') {
                window.renderPendingList();
            }
        };
        
        window.quantumSync.onPublishedUpdate = (apps) => {
            console.log('📦 Apps publicadas actualizadas:', apps.length);
            if (typeof window.renderTagFilters === 'function') {
                window.renderTagFilters();
            }
            if (typeof window.renderPublishedApps === 'function') {
                window.renderPublishedApps();
            }
        };
        
        window.quantumSync.onAppPublished = (app) => {
            window.showNotification(`✅ "${app.title}" publicado en la nube`);
        };
        
        window.quantumSync.onAppRejected = (appId) => {
            window.showNotification('🗑️ App rechazada en la nube');
        };
        
        // Conectar el Puzzle para escuchar mensajes
        window.quantumSync.connectPuzzle();
        
        console.log('✅ Quantum Sync inicializado correctamente');
        console.log('✅ quantumSync.isReady:', window.quantumSync.isReady);
        
        // Disparar actualización de UI
        if (typeof window.renderTagFilters === 'function') {
            window.renderTagFilters();
        }
        if (typeof window.renderPublishedApps === 'function') {
            window.renderPublishedApps();
        }
        
    } catch (error) {
        console.error('❌ Error inicializando Quantum Sync:', error);
        console.error('Detalles:', error.message);
        if (typeof window.showNotification === 'function') {
            window.showNotification('❌ Error de conexión con Supabase. Modo offline.');
        } else {
            console.warn('⚠️ showNotification aún no está disponible; mostrando solo en consola.');
        }
    }
})();
</script>

<script>
// ---------- GLOBALS ----------
let currentUser = null;
let isAdmin = false;
let isFounder = false;
let activeTagFilter = "all";
let studioIframeReady = false;
let studioIframeLoaded = false;
let pendingPreviewApp = null;
let compilerUrl = '';
let currentExecutingApp = null;
let pendingCompileRequest = null;

// ============================================================
// 🔄 FUNCIONES CON INTEGRACIÓN SUPABASE SYNC
// ============================================================

async function getPublishedApps() {
    if (window.quantumSync && window.quantumSync.isReady) {
        await window.quantumSync.syncPublishedApps();
        return window.quantumSync.publishedApps;
    }
    // Fallback a localStorage
    const stored = localStorage.getItem('qcol_published_quantum_apps');
    if(stored) return JSON.parse(stored);
    return [];
}

async function savePublishedApps(apps) {
    localStorage.setItem('qcol_published_quantum_apps', JSON.stringify(apps));
}

async function getPendingApps() {
    // SIEMPRE usar quantumSync si está disponible
    if (window.quantumSync && window.quantumSync.isReady) {
        await window.quantumSync.syncPendingApps();
        return window.quantumSync.pendingApps;
    }
    // Fallback a localStorage
    const stored = localStorage.getItem('qcol_pending_quantum_apps');
    if(stored) return JSON.parse(stored);
    return [];
}

async function savePendingApps(apps) {
    localStorage.setItem('qcol_pending_quantum_apps', JSON.stringify(apps));
}

// Initialize with RouteQ demo data (replaced old greeting demo)
if(!localStorage.getItem('qcol_published_quantum_apps')) {
    savePublishedApps([
        {
            id: 'routeq_demo_1',
            title: 'RouteQ — Quantum Delivery Optimizer',
            desc: 'Smart route optimization using quantum-inspired algorithms. Select stops, vehicle, priority — get the optimal delivery sequence.',
            tags: 'route,optimization,delivery,quantum',
            duration: 5,
            pythonCode: `# RouteQ Quantum Backend (Python)

import numpy as np
from datetime import datetime, timedelta

SPEED_KMH = {"Motorcycle": 45, "Van": 35, "Truck": 28}
DISTANCE_MATRIX_DEMO = np.array([
    [0, 8.2, 14.1, 31.0, 47.3],
    [8.2, 0, 6.5, 22.8, 39.1],
    [14.1, 6.5, 0, 16.3, 33.6],
    [31.0, 22.8, 16.3, 0, 18.5],
    [47.3, 39.1, 33.6, 18.5, 0],
])

def greedy_fallback(distance_matrix, n):
    visited = [False] * n
    route = [0]
    visited[0] = True
    for _ in range(n - 1):
        current = route[-1]
        nearest = min([j for j in range(n) if not visited[j]], 
                      key=lambda j: distance_matrix[current][j])
        route.append(nearest)
        visited[nearest] = True
    return route

def solve_route_quantum(stops, vehicle, priority):
    n = len(stops)
    if n > 5: n = 5
    distance_matrix = DISTANCE_MATRIX_DEMO[:n, :n].copy()
    if "Cost" in priority:
        distance_matrix = distance_matrix * 1.2
    elif "Eco" in priority:
        distance_matrix = distance_matrix * 0.9
    route = greedy_fallback(distance_matrix, n)
    return route

def calculate_metrics(route, stops, vehicle, priority):
    speed = SPEED_KMH.get(vehicle, 35)
    n = len(route)
    if n > len(DISTANCE_MATRIX_DEMO):
        n = len(DISTANCE_MATRIX_DEMO)
    distance_matrix = DISTANCE_MATRIX_DEMO[:n, :n]
    total_distance = sum(distance_matrix[route[i]][route[i+1]] for i in range(n-1))
    travel_time_h = total_distance / speed
    stop_time_h = n * 0.25
    total_time_h = travel_time_h + stop_time_h
    naive_distance = sum(distance_matrix[i][(i+1)%n] for i in range(n))
    naive_time_h = naive_distance / speed + stop_time_h
    saved_time_h = naive_time_h - total_time_h
    saved_time_min = int(saved_time_h * 60)
    saved_fuel = round(saved_time_h * speed * 0.08, 2)
    saved_co2 = round((naive_distance - total_distance) * 0.21, 1)
    start = datetime(2025, 1, 1, 8, 0)
    schedule = []
    current_time = start
    cumulative_dist = 0
    for idx, stop_idx in enumerate(route):
        if idx > 0:
            leg_dist = distance_matrix[route[idx-1]][stop_idx]
            cumulative_dist += leg_dist
            travel_min = int((leg_dist / speed) * 60)
            current_time += timedelta(minutes=travel_min)
        schedule.append({
            "order": idx + 1,
            "name": stops[stop_idx]["name"],
            "icon": stops[stop_idx]["icon"],
            "detail": stops[stop_idx]["sub"],
            "arrive": current_time.strftime("%I:%M %p"),
            "distance": round(cumulative_dist, 1)
        })
        current_time += timedelta(minutes=15)
    total_h = int(total_time_h)
    total_m = int((total_time_h - total_h) * 60)
    time_str = f"{total_h}h {total_m}min" if total_h > 0 else f"{total_m}min"
    saved_h = saved_time_min // 60
    saved_m = saved_time_min % 60
    saved_str = f"{saved_h}h {saved_m}min" if saved_h > 0 else f"{saved_m}min"
    return {
        "total_time": time_str,
        "total_distance": f"{round(total_distance, 1)}km",
        "stop_count": n,
        "route": schedule,
        "saved_time": saved_str,
        "saved_fuel": f"\${saved_fuel}",
        "saved_co2": f"{saved_co2} kg"
    }

def optimize_route(stops_data, vehicle, priority):
    stops = stops_data[:5]
    n = len(stops)
    route = solve_route_quantum(stops, vehicle, priority)
    return calculate_metrics(route, stops, vehicle, priority)`,

// Listen for pyCall from execIframe and execute them remotely
window.addEventListener('message', async function _execPyCallHandler(ev) {
    const d = ev.data;
    if (!d || d.type !== 'pyCall') return;
    const { id, func, args, serverUrl: appUrl, pythonCode } = d;
    const src = ev.source;

    const tid = setTimeout(() => {
        _execPyCalls.delete(id);
        try { src.postMessage({ type: 'pyResult', id, error: 'Timeout 35s' }, '*'); } catch(e) {}
    }, 35000);
    _execPyCalls.set(id, { src, tid });

    const serverUrl = appUrl || compilerUrl || localStorage.getItem('qcol_colab_url') || '';
    try {
        if (!serverUrl) throw new Error('No server URL. Configure it in the Founder Panel.');
        const callCode = (pythonCode ? pythonCode + '\n\n' : '') +
            'import json as _json\n' +
            '_args = _json.loads(' + JSON.stringify(JSON.stringify(args)) + ')\n' +
            '_result = ' + func + '(*_args)\n' +
            'print(_json.dumps(_result, ensure_ascii=False, default=str))';
        const output = await _runPythonRemote(callCode, serverUrl);
        clearTimeout(tid); _execPyCalls.delete(id);
        let parsed = (output || '').trim();
        try { parsed = JSON.parse(parsed); } catch(e) {}
        src.postMessage({ type: 'pyResult', id, result: parsed }, '*');
    } catch(err) {
        clearTimeout(tid); _execPyCalls.delete(id);
        src.postMessage({ type: 'pyResult', id, error: err.message }, '*');
    }
});

async function _runPythonRemote(code, serverUrl) {
    const base = (serverUrl || '').replace(/\/+$/, '');
    if (!base) throw new Error('No quantum server URL configured');
    const isHF  = base.includes('hf.space') || base.includes('huggingface');
    const url   = base + (isHF ? '/run/predict' : '/run');
    const body  = isHF
        ? JSON.stringify({ data: [code], fn_index: 1 })
        : JSON.stringify({ code });
    const res   = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
    const raw = await res.json();
    const out = isHF ? (raw.data?.[0] ?? raw) : raw;
    if (out?.success === false) throw new Error(out.output || out.error || 'Server error');
    return out?.output ?? out?.result ?? String(out ?? '');
}

function _buildAppBlob(pythonCode, htmlCode, serverUrl) {
    const bridge = `<script>
(function(){
    window.__serverUrl  = ${JSON.stringify(serverUrl  || '')};
    window.__pyCode     = ${JSON.stringify(pythonCode || '')};
    window.pyCall = function(funcName) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function(resolve, reject) {
            var msgId = Date.now() + '-' + Math.random().toString(36).slice(2);
            function handler(ev) {
                var d = ev.data;
                if (d && d.type === 'pyResult' && d.id === msgId) {
                    window.removeEventListener('message', handler);
                    if (d.error) reject(new Error(d.error));
                    else resolve(d.result);
                }
            }
            window.addEventListener('message', handler);
            window.parent.postMessage({
                type: 'pyCall', id: msgId, func: funcName, args: args,
                serverUrl: window.__serverUrl, pythonCode: window.__pyCode
            }, '*');
        });
    };
})();
<\/script>`;

    let html = htmlCode || '<!DOCTYPE html><html><body><h2>⚛️ App without interface</h2></body></html>';
    if (html.includes('</head>'))        html = html.replace('</head>', bridge + '</head>');
    else if (html.includes('<body'))      html = html.replace('<body', bridge + '<body');
    else if (html.includes('<html'))      html = html.replace('<html>', '<html>' + bridge);
    else                                  html = bridge + html;

    return URL.createObjectURL(new Blob([html], { type: 'text/html' }));
}

function executeWithStudio(app) {
    const loadingDiv = document.getElementById('execLoading');
    const iframe     = document.getElementById('execIframe');

    loadingDiv.style.display = 'flex';

    const serverUrl = app.serverUrl || compilerUrl || localStorage.getItem('qcol_colab_url') || '';

    if (!app.htmlCode && !app.pythonCode) {
        loadingDiv.style.display = 'none';
        showNotification('The app has no HTML or Python code.');
        return;
    }

    if (window._execBlobUrl) { URL.revokeObjectURL(window._execBlobUrl); }

    try {
        window._execBlobUrl = _buildAppBlob(app.pythonCode, app.htmlCode, serverUrl);
        iframe.src = window._execBlobUrl;
        iframe.onload = function() { loadingDiv.style.display = 'none'; };
        setTimeout(function() { if (loadingDiv.style.display !== 'none') loadingDiv.style.display = 'none'; }, 5000);
    } catch(err) {
        loadingDiv.style.display = 'none';
        showNotification('Error building app: ' + err.message);
    }
}

        var sf = document.getElementById('studioIframe');
        if (sf && sf.contentWindow) {
            sf.contentWindow.postMessage({ type: 'QCOL_REQUEST_STUDIO_CONNECTION' }, '*');
            // Conectar el módulo de sincronización
            if (window.quantumSync && window.quantumSync.isReady) {
                window.quantumSync.connectStudio(sf);
                // Enviar URL del compilador
                const url = compilerUrl || localStorage.getItem('qcol_colab_url') || '';
                if (url) {
                    sf.contentWindow.postMessage({ type: 'QCOL_SET_COMPILER_URL', url: url }, '*');
                }
            }
        }
    }, 400);
}

function closeStudioModal() { studioModal.classList.remove('open'); }

// ============================================================
// 🔥 MANEJADOR DE MENSAJES DEL STUDIO
// ============================================================
window.addEventListener('message', async function(e) {
    const data = e.data;
    if (!data || typeof data !== 'object') return;
    
    console.log('📨 Mensaje recibido en Puzzle:', data.type, data);
    
    // Mensaje del Studio: sincronizar app a la nube
    if (data.type === 'QCOL_STUDIO_SYNC_APP') {
        const { appId, appData } = data;
        console.log('📥 Recibido sync desde Studio:', appId, appData);
        
        if (window.quantumSync && window.quantumSync.isReady) {
            try {
                const result = await window.quantumSync.submitApp({
                    id: appData.id || appId,
                    name: appData.name || appData.title || 'Untitled',
                    title: appData.title || appData.name || 'Untitled',
                    description: appData.description || '',
                    tags: appData.tags || '',
                    pythonCode: appData.pythonCode || '',
                    htmlCode: appData.htmlCode || '',
                    serverUrl: appData.serverUrl || '',
                    duration: appData.duration || 8
                });
                
                showNotification(`☁️ App "${result.title}" sincronizada con la nube (pendiente)`);
                
                // Actualizar la UI (pendientes)
                if (typeof renderPendingList === 'function') {
                    await renderPendingList();
                }
                
                if (e.source) {
                    e.source.postMessage({
                        type: 'QCOL_STUDIO_SYNC_CONFIRMED',
                        appId: appId,
                        success: true,
                        title: result.title
                    }, e.origin);
                }
            } catch (error) {
                console.error('❌ Error sincronizando desde Studio:', error);
                showNotification('❌ Error al sincronizar: ' + error.message);
                
                if (e.source) {
                    e.source.postMessage({
                        type: 'QCOL_STUDIO_SYNC_CONFIRMED',
                        appId: appId,
                        success: false,
                        error: error.message
                    }, e.origin);
                }
            }
        } else {
            console.warn('⚠️ Quantum Sync no disponible, guardando localmente');
            const pending = JSON.parse(localStorage.getItem('qcol_pending_quantum_apps') || '[]');
            const existing = pending.find(p => p.id === appId);
            if (existing) {
                Object.assign(existing, appData);
            } else {
                pending.push(appData);
            }
            localStorage.setItem('qcol_pending_quantum_apps', JSON.stringify(pending));
            showNotification(`📦 App "${appData.title}" guardada localmente`);
            
            if (typeof renderPendingList === 'function') {
                await renderPendingList();
            }
            
            if (e.source) {
                e.source.postMessage({
                    type: 'QCOL_STUDIO_SYNC_CONFIRMED',
                    appId: appId,
                    success: true,
                    local: true
                }, e.origin);
            }
        }
    }
});

// ============================================================
// OTROS MANEJADORES DE MENSAJES
// ============================================================
window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'QCOL_COMPILER_URL' && data.url) { 
        compilerUrl = data.url; 
        showNotification('Quantum server configured', 1500); 
        return; 
    }
    if (data.type === 'QCOL_STUDIO_OPENED') { 
        studioIframeReady = true; 
        showNotification('⚡ Quantum App Studio ready', 1500); 
        return; 
    }
    if (data.type === 'QCOL_APP_SAVED') { 
        renderTagFilters(); 
        renderPublishedApps(); 
    }
    if (data.type === 'QCOL_APP_DELETED') { 
        renderTagFilters(); 
        renderPublishedApps(); 
    }
    if(data.type === 'QCOL_USER_UPDATE') {
        currentUser = data.user;
        isAdmin = (currentUser?.role === 'admin' || currentUser?.role === 'founder');
        isFounder = (currentUser?.role === 'founder');
        const adminBar = document.getElementById('adminBar');
        if(adminBar) adminBar.classList.toggle('show', isFounder);
        renderTagFilters();
        renderPublishedApps();
    }
});

function openPendingManager() {
    if(!isFounder && !isAdmin) { showNotification("Access for founders/admins only"); return; }
    renderPendingList();
    document.getElementById('pendingModal').classList.add('open');
}
function closePendingModal() { document.getElementById('pendingModal').classList.remove('open'); }

// ============================================================
// 🔥 RENDER PENDING LIST
// ============================================================
async function renderPendingList() {
    console.log('🔄 Renderizando lista de pendientes...');
    console.log('📌 window.quantumSync:', window.quantumSync);
    console.log('📌 window.quantumSync.isReady:', window.quantumSync?.isReady);
    
    const pending = await getPendingApps();
    console.log('📋 Apps pendientes:', pending);
    const container = document.getElementById('pendingListContainer');
    if(!container) return;
    if(pending.length === 0) { 
        container.innerHTML = `<div style="padding:2rem; text-align:center; color:var(--mu);">📭 No apps pending approval.</div>`; 
        return; 
    }
    let html = `<div class="pending-grid">`;
    pending.forEach(app => {
        const title = app.title || app.name || 'Untitled App';
        const appId = app.id;
        html += `<div style="background: #0a1222; border-radius: 16px; margin-bottom: 12px; padding: 12px;">
                    <strong>${escapeHtml(title)}</strong>
                    <div style="margin-top:8px; display:flex; gap:8px;">
                        <button class="btn" style="background: #00aa66;" onclick="publishPendingApp('${appId}')">✅ PUBLISH</button>
                        <button class="btn" style="background: #aa3355;" onclick="rejectPendingApp('${appId}')">🗑️ REJECT</button>
                    </div>
                </div>`;
    });
    html += `</div>`;
    container.innerHTML = html;
}

// ============================================================
// 🔥 PUBLISH PENDING APP
// ============================================================
async function publishPendingApp(appId) {
    console.log('📤 Publicando app:', appId);
    console.log('📌 window.quantumSync:', window.quantumSync);
    console.log('📌 window.quantumSync.isReady:', window.quantumSync?.isReady);
    
    if (!isFounder && !isAdmin) { 
        showNotification("Solo fundadores/admins pueden publicar"); 
        return; 
    }
    
    // SOLO usar quantumSync
    if (!window.quantumSync || !window.quantumSync.isReady) {
        showNotification("❌ No hay conexión con la nube. Revisa la consola.");
        console.error('❌ quantumSync no disponible o no inicializado');
        return;
    }
    
    try {
        console.log('🔄 Usando quantumSync para publicar...');
        const published = await window.quantumSync.approveApp(appId, currentUser?.id);
        console.log('✅ App publicada:', published);
        showNotification(`✅ App "${published.title}" publicada en la nube`);
        
        // FORZAR recarga desde Supabase
        await window.quantumSync.syncPendingApps();
        await window.quantumSync.syncPublishedApps();
        
        // Actualizar UI
        await renderPendingList();
        renderTagFilters();
        await renderPublishedApps();
        
    } catch (error) {
        console.error('❌ Error al publicar:', error);
        showNotification('❌ Error al publicar: ' + error.message);
    }
}

// ============================================================
// 🔥 REJECT PENDING APP
// ============================================================
async function rejectPendingApp(appId) {
    console.log('🗑️ Rechazando app:', appId);
    if (!isFounder && !isAdmin) return;
    if (!confirm("Delete this pending app?")) return;
    
    if (!window.quantumSync || !window.quantumSync.isReady) {
        showNotification("❌ No hay conexión con la nube");
        return;
    }
    
    try {
        await window.quantumSync.rejectApp(appId);
        showNotification("App rechazada en la nube");
        await window.quantumSync.syncPendingApps();
        await renderPendingList();
    } catch (error) {
        showNotification('❌ Error al rechazar: ' + error.message);
    }
}

async function deletePublishedApp(appId) {
    if(!isFounder) { showNotification("Only founder can delete published apps"); return; }
    if(!confirm(`Delete app from repository?`)) return;
    
    if (!window.quantumSync || !window.quantumSync.isReady) {
        showNotification("❌ No hay conexión con la nube");
        return;
    }
    
    try {
        await window.quantumSync.deletePublishedApp(appId);
        showNotification("App eliminada de la nube");
        await window.quantumSync.syncPublishedApps();
        renderTagFilters();
        await renderPublishedApps();
    } catch (error) {
        showNotification('❌ Error al eliminar: ' + error.message);
    }
}

function showNotification(msg, dur=2800) {
    const n = document.getElementById('notifMsg');
    n.textContent = msg;
    n.classList.add('show');
    if(n._timeout) clearTimeout(n._timeout);
    n._timeout = setTimeout(() => n.classList.remove('show'), dur);
}

// ============================================================
// HACER FUNCIONES GLOBALES
// ============================================================
window.renderTagFilters = renderTagFilters;
window.renderPublishedApps = renderPublishedApps;
window.renderPendingList = renderPendingList;
window.showNotification = showNotification;
window.publishPendingApp = publishPendingApp;
window.rejectPendingApp = rejectPendingApp;
window.deletePublishedApp = deletePublishedApp;
window.openPendingManager = openPendingManager;
window.openQuantumAppStudio = openQuantumAppStudio;
window.closeStudioModal = closeStudioModal;

// Inicializar UI
setTimeout(() => {
    renderTagFilters();
    renderPublishedApps();
}, 500);

document.getElementById('studioModalReal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('studioModalReal')) closeStudioModal(); });
document.getElementById('pendingModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('pendingModal')) closePendingModal(); });
document.getElementById('execAppModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('execAppModal')) closeExecModal(); });
</script>
