name: Theoretical gates & U synthesis
on:
  push:
    paths: ["quolab-nexus-theoretical-gates.js","quolab-nexus-tg-ui.js","quolab-nexus-u-*.js","tests/quolab-nexus-theoretical-gates.test.cjs","tests/quolab-nexus-u-synthesis.test.cjs","tests/test_theoretical_gates_qiskit.py",".github/workflows/theoretical-gates.yml"]
  pull_request:
    paths: ["quolab-nexus-theoretical-gates.js","quolab-nexus-tg-ui.js","quolab-nexus-u-*.js","tests/quolab-nexus-theoretical-gates.test.cjs","tests/quolab-nexus-u-synthesis.test.cjs","tests/test_theoretical_gates_qiskit.py",".github/workflows/theoretical-gates.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install qiskit numpy
      - run: node tests/quolab-nexus-theoretical-gates.test.cjs
      - run: node tests/quolab-nexus-u-synthesis.test.cjs
      - run: python tests/test_theoretical_gates_qiskit.py
