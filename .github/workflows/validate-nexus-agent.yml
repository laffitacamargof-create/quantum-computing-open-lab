name: Validate QuOLab Nexus AI

on:
  push:
    branches:
      - feature/quolab-nexus-five-specialists
      - feature/quolab-nexus-real-specialist-dispatch
  pull_request:
    paths:
      - "index.html"
      - "quolab-nexus-agent.js"
      - "quolab-nexus-tool-connector.js"
      - "quolab-nexus-*.html"
      - "tests/quolab-nexus-specialists.test.cjs"
      - ".github/workflows/validate-nexus-agent.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check central agent syntax
        run: node --check quolab-nexus-agent.js
      - name: Check universal tool connector syntax
        run: node --check quolab-nexus-tool-connector.js
      - name: Verify unified single-agent architecture and tool routing
        run: node tests/quolab-nexus-specialists.test.cjs
      - name: Extract and check the main index module
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script type="module">([\s\S]*?)</script>', source)
          if len(blocks) != 1:
              raise SystemExit(f"Expected one main module script, found {len(blocks)}")
          Path("/tmp/quolab-index.mjs").write_text(blocks[0], encoding="utf-8")
          PY
          node --check /tmp/quolab-index.mjs
      - name: Extract and check inline scripts in every tool module
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          pages = [
              "quolab-nexus-projects.html",
              "quolab-nexus-architect.html",
              "quolab-nexus-quantum-notebook.html",
              "quolab-nexus-quantum-puzzle.html",
              "quolab-nexus-app-studio.html",
              "quolab-nexus-library.html",
              "quolab-nexus-help.html",
          ]
          count = 0
          for page in pages:
              source = Path(page).read_text(encoding="utf-8")
              for match in re.finditer(r'<script\\b([^>]*)>([\\s\\S]*?)</script\\s*>', source, re.I):
                  attrs, body = match.group(1), match.group(2)
                  if re.search(r'\\bsrc\\s*=', attrs, re.I) or not body.strip():
                      continue
                  kind = re.search(r'\\btype\\s*=\\s*["\\']([^"\\']+)["\\']', attrs, re.I)
                  if kind and kind.group(1).lower() not in ("module", "text/javascript", "application/javascript"):
                      continue
                  suffix = "mjs" if kind and kind.group(1).lower() == "module" else "js"
                  Path(f"/tmp/quolab-module-{count}.{suffix}").write_text(body, encoding="utf-8")
                  count += 1
          if count == 0:
              raise SystemExit("No inline module scripts found")
          print(f"Extracted {count} inline tool scripts")
          PY
          for file in /tmp/quolab-module-*.js /tmp/quolab-module-*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
