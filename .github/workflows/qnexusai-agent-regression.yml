name: QNexusAi agent regression
on:
  push:
    branches: [main, 'fix/qnexusai-agent-routing-*']
  pull_request:
    branches: [main]
jobs:
  infer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify tool routing across active screens
        run: node tests/qnexusai-agent-regression.cjs
      - name: Verify browser and gateway guardrails
        run: |
          node --check <(sed -n '/function inferAIContextTools/,/^  }/p' index.html) || true
          grep -q 'providerDeadline' supabase/functions/quolab-nexus-ai/index.ts
          ! grep -q 'SUPABASE_SERVICE_KEY' quolab-nexus-cloud-sync.js
