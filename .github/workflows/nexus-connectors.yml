name: Nexus Connectors regression checks
on:
  push:
    branches: [main, "fix/nexus-connectors-hardening", "fix/nexus-connectors-final-20261120"]
  pull_request:
    branches: [main]
jobs:
  connector-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile bridge
        run: python -m py_compile nexus-bridge/nexus_bridge.py
      - name: Test community AST security
        run: python -m unittest discover -s tests/nexus_connectors -p "test_*.py"
      - name: Check connector core JavaScript
        run: node --check quolab-nexus-connectors-core.js
      - name: Test connector slot rules and API boundaries
        run: node tests/nexus_connectors/test_core_slots.js
      - name: Check inline application scripts
        run: python tests/nexus_connectors/check_inline_js.py
