name: Nexus Connectors Security Tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  connector-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile local bridge
        run: python -m py_compile nexus-bridge/nexus_bridge.py
      - name: Run connector AST security regressions
        run: python -m unittest discover -s tests -p "test_nexus_connectors_security.py" -v
