name: Nexus bridge security tests

on:
  pull_request:
    paths:
      - "nexus-bridge/**"
      - ".github/workflows/nexus-bridge-security.yml"
  push:
    branches: [main]
    paths:
      - "nexus-bridge/**"
      - ".github/workflows/nexus-bridge-security.yml"

jobs:
  bridge-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Compile bridge
        working-directory: nexus-bridge
        run: python -m py_compile nexus_bridge.py
      - name: Run community sandbox regression tests
        working-directory: nexus-bridge
        run: python -m unittest -v test_community_sandbox.py
