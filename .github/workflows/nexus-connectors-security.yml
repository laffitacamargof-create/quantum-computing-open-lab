name: Nexus Connectors Security
on:
  push:
    paths:
      - "nexus-bridge/**"
      - "tests/test_nexus_connectors_security.py"
      - ".github/workflows/nexus-connectors-security.yml"
  pull_request:
    paths:
      - "nexus-bridge/**"
      - "tests/test_nexus_connectors_security.py"
      - ".github/workflows/nexus-connectors-security.yml"
jobs:
  bridge-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run connector security regressions
        run: python -m unittest discover -s tests -p "test_nexus_connectors_security.py" -v
