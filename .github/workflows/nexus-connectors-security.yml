name: Nexus connector security tests

on:
  push:
    paths:
      - "nexus-bridge/**"
      - ".github/workflows/nexus-connectors-security.yml"
  pull_request:
    paths:
      - "nexus-bridge/**"
      - ".github/workflows/nexus-connectors-security.yml"

jobs:
  bridge-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bridge security regression tests
        run: python -m unittest discover -s nexus-bridge/tests -v
