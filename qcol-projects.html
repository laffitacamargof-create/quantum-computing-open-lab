<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCOL Projects · Quantum Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#010608;--s:#071220;--s2:#0c1c30;--b:#0d2a4a;--b2:#1a3a5c;--bl:#0088ff;--bl2:#00ccff;--gr:#00ff88;--gd:#ffd700;--rd:#ff4466;--tx:#ddeeff;--mu:#4a7a9b;--orb:'Orbitron',monospace;--mono:'JetBrains Mono',monospace;--exo:'Exo 2',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:var(--exo);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,136,255,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,136,255,.03)1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.notif{position:fixed;top:.8rem;right:.8rem;z-index:999;padding:.55rem 1rem;background:rgba(4,14,28,.97);border:1px solid var(--bl2);border-radius:8px;font-family:var(--orb);font-size:.6rem;color:var(--bl2);transform:translateX(130%);transition:transform .3s; backdrop-filter: blur(2px);}
.notif.show{transform:translateX(0);}
.toolbar{display:flex;align-items:center;gap:.7rem;padding:.85rem 1.3rem;background:var(--s);border-bottom:1px solid var(--b);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.search-box{display:flex;align-items:center;gap:.4rem;background:rgba(0,0,0,.35);border:1px solid var(--b2);border-radius:7px;padding:.32rem .7rem;flex:1;max-width:300px;}
.search-box input{background:transparent;border:none;color:var(--tx);font-family:var(--exo);font-size:.75rem;outline:none;width:100%;}
.search-box input::placeholder{color:var(--mu);}
.filter-btns{display:flex;gap:.3rem;}
.fbtn{padding:.28rem .65rem;background:transparent;border:1px solid var(--b2);border-radius:5px;color:var(--mu);font-family:var(--orb);font-size:.52rem;cursor:pointer;transition:all .2s;}
.fbtn.on{background:rgba(0,136,255,.15);border-color:var(--bl);color:var(--bl2);}
.btn{padding:.32rem .75rem;border:none;border-radius:6px;font-family:var(--orb);font-size:.55rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-pri{background:linear-gradient(135deg,#003388,var(--bl));color:#fff;}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,136,255,.4);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;text-align:center;gap:1.2rem;min-height:55vh;}
.empty-icon{font-size:3.5rem;opacity:.4;}
.empty-title{font-family:var(--orb);font-size:.95rem;color:var(--mu);}
.empty-desc{font-size:.74rem;color:var(--mu);max-width:380px;line-height:1.75;opacity:.7;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;padding:1.3rem;max-width:1200px;margin:0 auto;width:100%;}
.card{background:var(--s);border:1px solid var(--b);border-radius:13px;overflow:hidden;transition:all .3s;animation:fu .4s ease both;}
@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card:hover{border-color:rgba(0,136,255,.5);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,136,255,.1);}
.card-hdr{padding:.75rem 1rem;background:var(--s2);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;}
.tbadge{font-family:var(--orb);font-size:.5rem;padding:.13rem .42rem;border-radius:4px;}
.tnb{background:rgba(0,136,255,.15);color:var(--bl2);border:1px solid rgba(0,136,255,.3);}
.tpdf{background:rgba(255,68,102,.12);color:#ff8899;border:1px solid rgba(255,68,102,.3);}
.tvid{background:rgba(0,255,136,.1);color:var(--gr);border:1px solid rgba(0,255,136,.3);}
.card-tags{font-family:var(--mono);font-size:.5rem;color:var(--mu);}
.card-body{padding:1rem;}
.card-title{font-family:var(--orb);font-size:.72rem;color:var(--tx);margin-bottom:.35rem;}
.card-desc{font-size:.68rem;color:var(--mu);line-height:1.65;margin-bottom:.8rem;}
.card-meta{display:flex;gap:.85rem;font-size:.6rem;color:var(--mu);margin-bottom:.75rem;font-family:var(--mono);}
.card-actions{display:flex;gap:.4rem;}
.btn-exec{flex:1;padding:.52rem;background:linear-gradient(135deg,rgba(0,136,255,.18),rgba(0,200,255,.08));border:1px solid rgba(0,136,255,.4);border-radius:7px;color:var(--bl2);font-family:var(--orb);font-size:.58rem;cursor:pointer;transition:all .2s;}
.btn-exec:hover{background:rgba(0,136,255,.28);}
.btn-del{padding:.52rem .65rem;background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.2);border-radius:7px;color:#ff8899;font-family:var(--orb);font-size:.58rem;cursor:pointer;}
.btn-del:hover{background:rgba(255,68,102,.18);}
.btn-edit{padding:.52rem .65rem;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);border-radius:7px;color:#88ffaa;font-family:var(--orb);font-size:.58rem;cursor:pointer;}
.btn-edit:hover{background:rgba(0,255,136,.18);}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;align-items:center;justify-content:center;backdrop-filter: blur(3px);}
.modal-ov.open{display:flex;}
.modal{background:var(--s);border:1px solid rgba(0,136,255,.45);border-radius:14px;padding:1.7rem;width:min(500px,92vw);max-height:90vh;overflow-y:auto;animation:su .3s ease;}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-family:var(--orb);font-size:.88rem;color:var(--bl2);margin-bottom:1.2rem;}
.fg{margin-bottom:.8rem;}
.fl{font-family:var(--orb);font-size:.52rem;color:var(--mu);letter-spacing:.1em;display:block;margin-bottom:.25rem;}
.fi{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--b2);border-radius:7px;padding:.5rem .8rem;color:var(--tx);font-family:var(--exo);font-size:.78rem;outline:none;}
.fi:focus{border-color:rgba(0,136,255,.7);}
select.fi{cursor:pointer;}
textarea.fi{resize:vertical;min-height:70px;line-height:1.6;}
.btn-row{display:flex;gap:.5rem;margin-top:.8rem;}
.btn-cancel{padding:.45rem .9rem;background:transparent;border:1px solid var(--b2);border-radius:7px;color:var(--mu);font-family:var(--orb);font-size:.58rem;cursor:pointer;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.banner{margin:1rem 1.3rem 0;padding:.5rem .9rem;border:1px solid rgba(255,215,0,.3);background:rgba(255,215,0,.06);border-radius:8px;font-family:var(--orb);font-size:.52rem;color:var(--gd);display:flex;align-items:center;gap:.6rem;}
.banner button{margin-left:auto;}
.hint{font-size:.62rem;color:var(--mu);line-height:1.6;margin-bottom:.8rem;}
</style>
</head>
<body>
<div class="notif" id="notif"></div>
<div class="toolbar">
  <div class="search-box">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="#4a7a9b" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="#4a7a9b" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" placeholder="Search..." oninput="render()">
  </div>
  <div class="filter-btns">
    <button class="fbtn on" onclick="setF('all',this)">All</button>
    <button class="fbtn" onclick="setF('nb',this)">Notebooks</button>
    <button class="fbtn" onclick="setF('pdf',this)">PDFs</button>
    <button class="fbtn" onclick="setF('video',this)">Videos</button>
  </div>
</div>
<div id="content"></div>

<!-- EDIT MODAL (founders only) -->
<div class="modal-ov" id="edit-modal">
  <div class="modal">
    <div class="modal-title">✏️ Edit Project</div>
    <div class="fg"><label class="fl">TITLE</label><input class="fi" id="e-t" placeholder="Project title"></div>
    <div class="fg"><label class="fl">TYPE</label>
      <select class="fi" id="e-type" disabled style="opacity:0.7;">
        <option value="pdf">PDF / LaTeX</option>
        <option value="video">Video</option>
        <option value="nb">Notebook .ipynb</option>
      </select>
    </div>
    <div class="fg" id="e-id-wrap"><label class="fl">FILE ID (unique, not editable)</label><input class="fi" id="e-id" readonly disabled style="opacity:0.7;background:#0a1428;"></div>
    <div class="fg"><label class="fl">DESCRIPTION</label><textarea class="fi" id="e-desc" placeholder="Description"></textarea></div>
    <div class="fg" id="e-url-wrap"><label class="fl">URL</label><input class="fi" id="e-url" placeholder="https://..."></div>
    <div class="fg"><label class="fl">TAGS</label><input class="fi" id="e-tags" placeholder="tags"></div>
    <div class="g2">
      <div class="fg"><label class="fl">CELLS / PAGES</label><input class="fi" id="e-size" type="number"></div>
      <div class="fg"><label class="fl">TIME (min)</label><input class="fi" id="e-time" type="number"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-pri" onclick="updateProj()">💾 Save changes</button>
      <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
    </div>
  </div>
</div>

<!-- FOUNDER KEY MODAL -->
<div class="modal-ov" id="key-modal">
  <div class="modal">
    <div class="modal-title">🔑 Founder key</div>
    <p class="hint">Enter the founder key to manage items you did not publish from this device. It is stored only in this browser.</p>
    <div class="fg"><input class="fi" id="key-inp" type="password" placeholder="Founder key" autocomplete="off"></div>
    <div class="btn-row">
      <button class="btn btn-pri" onclick="keyModalOk()">✅ Confirm</button>
      <button class="btn-cancel" onclick="keyModalCancel()">Cancel</button>
    </div>
  </div>
</div>

<script src="repo-sync.js"></script>
<script>
let curUser=null,isAdmin=false,isFounder=false,cfg={},filt='all';
let editingProjId=null;
let items=[],loading=true,loadError=null,refreshFn=null;

function postCore(t,d={}){window.parent.postMessage({type:t,...d},'*');}
function notify(msg){const n=document.getElementById('notif');n.textContent=msg;n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),3000);postCore('OPENQ_NOTIFY',{msg});}
function errMsg(e){return RepoSync.friendlyError(e);}

window.addEventListener('message',e=>{
  const d=e.data;if(!d?.type)return;
  if(typeof d.type==='string'&&d.type.indexOf('QCOL_')===0)d.type='OPENQ_'+d.type.slice(5); // compat.
  if(d.type==='OPENQ_CONFIG'){cfg=d;}
  if(d.type==='OPENQ_USER_UPDATE'){
    curUser=d.user;
    isAdmin = (curUser?.role==='admin' || curUser?.role==='founder');
    isFounder = (curUser?.role==='founder');
    render();
  }
});
postCore('OPENQ_GET_CONFIG');

// ==================== DATA (nube) ====================
function fromRow(r){
  return {id:r.id,type:r.kind,slug:r.slug||'',title:r.title||'',desc:r.description||'',
    tags:r.tags||'',size:r.cell_count||0,time:r.est_minutes||0,url:r.file_url||'',
    author:r.author_name||'',added:r.created_at||''};
}
function getP(){return items;}
function applyRows(rows,err){
  loading=false;
  if(err){
    loadError=err;
    if(!items.length){const c=RepoSync.getCached();if(c&&c.length)items=c.map(fromRow);}
  }else{
    loadError=null;
    items=rows.map(fromRow);
  }
  render();
}
function reload(){ if(refreshFn) return refreshFn(); }

// ==================== FILTERS ====================
function setF(f,el){filt=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');render();}

// ==================== PERMISOS ====================
function canManage(p){ return isFounder || RepoSync.hasOwnKey(p.id); }

function askFounderKey(){
  return new Promise(resolve=>{
    window._keyResolve=resolve;
    const i=document.getElementById('key-inp'); i.value='';
    document.getElementById('key-modal').classList.add('open');
    setTimeout(()=>i.focus(),50);
  });
}
function keyModalOk(){
  const v=document.getElementById('key-inp').value.trim();
  document.getElementById('key-modal').classList.remove('open');
  if(window._keyResolve){window._keyResolve(v||null);window._keyResolve=null;}
}
function keyModalCancel(){
  document.getElementById('key-modal').classList.remove('open');
  if(window._keyResolve){window._keyResolve(null);window._keyResolve=null;}
}
document.getElementById('key-inp').addEventListener('keydown',e=>{if(e.key==='Enter')keyModalOk();});

async function ensureFounderKey(){
  let k=RepoSync.getFounderKey();
  if(k) return k;
  k=await askFounderKey();
  if(!k) return null;
  try{
    const ok=await RepoSync.verifyFounder(k);
    if(!ok){notify('❌ Wrong founder key');return null;}
  }catch(e){notify('❌ '+errMsg(e));return null;}
  RepoSync.setFounderKey(k);
  return k;
}
// llave a usar para un item: la propia (si lo publiqué yo) o la del fundador
async function keyFor(id){
  const own=RepoSync.ownKey(id);
  if(own) return own;
  if(isFounder) return await ensureFounderKey();
  return null;
}

// ==================== RENDER ====================
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const all=getP().filter(p=>{
    const mf=filt==='all'||p.type===filt;
    const mq=!q||p.title.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)||(p.tags||'').toLowerCase().includes(q);
    return mf&&mq;
  });
  const c=document.getElementById('content');
  let banner='';
  if(loadError){
    banner=`<div class="banner">⚠️ No connection to the cloud${items.length?' — showing the last saved copy':''}.<button class="btn btn-pri" onclick="reload()">Retry</button></div>`;
  }
  if(loading&&!items.length){
    c.innerHTML=`<div class="empty"><div class="empty-icon">☁️</div><div class="empty-title">Loading projects...</div></div>`;return;
  }
  if(all.length===0){
    c.innerHTML=banner+`<div class="empty"><div class="empty-icon">📂</div>
      <div class="empty-title">${q?'No results':'No projects yet'}</div>
      <div class="empty-desc">${q?'No projects found for "'+escapeHtml(q)+'"':'Nothing has been published yet. Publish a notebook from Quantum Notebook → 📤 PUBLISH.'}</div>
    </div>`;return;
  }
  c.innerHTML=banner+'<div class="grid">'+all.map(p=>{
    const tl=p.type==='nb'?'NOTEBOOK':p.type==='pdf'?'PDF LaTeX':'VIDEO';
    const tc=p.type==='nb'?'tnb':p.type==='pdf'?'tpdf':'tvid';
    const meta=p.type==='nb'?`<span>⚛ ${p.size||0} cells</span><span>⏱ ${p.time||10} min</span>`:p.type==='pdf'?`<span>📄 ${p.size||10} pages</span><span>⏱ ${p.time||10} min</span>`:`<span>▶ Video</span><span>⏱ ${p.time||10} min</span>`;
    const author=p.author?`<div class="card-meta"><span>👤 ${escapeHtml(p.author)}</span></div>`:'';
    const manage=canManage(p);
    const delBtn = manage ? `<button class="btn-del" onclick="delProj('${p.id}')" title="Delete permanently">🗑</button>` : '';
    const editBtn = manage ? `<button class="btn-edit" onclick="editProj('${p.id}')" title="Edit project">✏️</button>` : '';
    const execText = p.type==='nb'?'▶ RUN':p.type==='pdf'?'📖 VIEW':'▶ VIEW';
    return`<div class="card"><div class="card-hdr"><span class="tbadge ${tc}">${tl}</span><span class="card-tags">${escapeHtml(p.tags||'')}</span></div>
      <div class="card-body"><div class="card-title">${escapeHtml(p.title)}</div><p class="card-desc">${escapeHtml(p.desc||'')}</p>
      <div class="card-meta">${meta}</div>${author}
      <div class="card-actions"><button class="btn-exec" onclick="execProj('${p.id}')">${execText}</button>${editBtn}${delBtn}</div></div></div>`;
  }).join('')+'</div>';
}

function escapeHtml(str){if(!str)return '';return String(str).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

// ==================== EJECUTAR / ABRIR ====================
async function execProj(id) {
  const p = items.find(x => x.id === id);
  if (!p) { notify('Project not found'); return; }

  if (p.type === 'nb') {
    notify('⏳ Loading notebook...');
    try{
      const row = await RepoSync.getContent(id);
      const cells = Array.isArray(row.content) ? row.content : [];
      const nb = {
        title: row.title || 'Untitled',
        name:  row.title || 'Untitled',
        desc:  row.description || '',
        cells: cells.length ? cells : [{
          id:'c'+Date.now(), type:'markdown',
          code:`# ${row.title||'Notebook'}\n\n${row.description||''}`,
          output:'', exec_count:null, mdEdit:false
        }]
      };
      // El core enruta este mensaje al Quantum Notebook (modo exposición)
      window.parent.postMessage({ type:'OPENQ_OPEN_NB_EXPOSITION', nb:nb, expositionMode:true }, '*');
      notify('👁 Opening in exposition mode...');
    }catch(e){
      notify(e.message==='not_found' ? '⚠️ This notebook no longer exists' : '❌ '+errMsg(e));
      reload();
    }
  } else if (p.type === 'pdf') {
    if (p.url) { window.open(p.url, '_blank', 'noopener'); return; }
    const gh = cfg && cfg.ghUser ? cfg.ghUser : 'laffitacamargof-create';
    const repo = cfg && cfg.ghRepo ? cfg.ghRepo : 'quantum-computing-open-lab';
    window.open(`https://github.com/${gh}/${repo}/blob/main/docs/${p.slug||p.id}.pdf`, '_blank', 'noopener');
  } else if (p.type === 'video') {
    if (p.url) window.open(p.url, '_blank', 'noopener');
    else notify('⚠️ This video has no URL yet');
  } else {
    notify('Unrecognized project type: ' + p.type);
  }
}

// ==================== DELETE ====================
async function delProj(id){
  const p=items.find(x=>x.id===id);
  if(!p||!canManage(p)){ notify('❌ You cannot delete this project'); return; }
  if(!confirm('⚠️ Permanently delete "'+p.title+'" for everyone?'))return;
  const key=await keyFor(id);
  if(!key){ notify('❌ Key required'); return; }
  try{
    await RepoSync.remove(id,key);
    notify('🗑 Project deleted');
  }catch(e){
    if(/forbidden/i.test(e.message)&&isFounder) RepoSync.clearFounderKey();
    notify('❌ '+errMsg(e));
  }
  reload();
}

// ==================== EDIT ====================
function editProj(id){
  const proj=items.find(p=>p.id===id);
  if(!proj){ notify('Project not found'); return; }
  if(!canManage(proj)){ notify('❌ You cannot edit this project'); return; }
  editingProjId=id;
  document.getElementById('e-t').value=proj.title;
  document.getElementById('e-type').value=proj.type;
  document.getElementById('e-id').value=proj.slug||'';
  document.getElementById('e-id-wrap').style.display=proj.type==='nb'?'none':'';
  document.getElementById('e-url-wrap').style.display=proj.type==='nb'?'none':'';
  document.getElementById('e-url').value=proj.url||'';
  document.getElementById('e-desc').value=proj.desc||'';
  document.getElementById('e-tags').value=proj.tags||'';
  document.getElementById('e-size').value=proj.size||10;
  document.getElementById('e-time').value=proj.time||15;
  document.getElementById('edit-modal').classList.add('open');
}
function closeEdit(){ document.getElementById('edit-modal').classList.remove('open'); editingProjId=null; }
async function updateProj(){
  if(!editingProjId){ notify('Internal error'); closeEdit(); return; }
  const id=editingProjId;
  const proj=items.find(p=>p.id===id);
  if(!proj||!canManage(proj)){ notify('Action denied'); closeEdit(); return; }
  const newTitle=document.getElementById('e-t').value.trim();
  const newDesc=document.getElementById('e-desc').value.trim();
  const newTags=document.getElementById('e-tags').value.trim();
  const newSize=parseInt(document.getElementById('e-size').value)||10;
  const newTime=parseInt(document.getElementById('e-time').value)||15;
  const newUrl=document.getElementById('e-url').value.trim();
  if(!newTitle){ notify('Title cannot be empty'); return; }
  if(newUrl&&!/^https?:\/\//i.test(newUrl)){notify('URL must start with http:// or https://');return;}
  const key=await keyFor(id);
  if(!key){ notify('❌ Key required'); return; }
  const fields={title:newTitle,description:newDesc,tags:newTags,cell_count:newSize,est_minutes:newTime};
  if(proj.type!=='nb'&&newUrl) fields.file_url=newUrl;
  try{
    await RepoSync.update(id,key,fields);
    notify('✏️ Project updated');
    closeEdit();
  }catch(e){
    if(/forbidden/i.test(e.message)&&isFounder) RepoSync.clearFounderKey();
    notify('❌ '+errMsg(e));
  }
  reload();
}

// ==================== MODAL CLOSE EVENTS ====================
document.getElementById('edit-modal').addEventListener('click',e=>{if(e.target===document.getElementById('edit-modal'))closeEdit();});

// ==================== INICIO ====================
window.render=render;
render();
if(window.RepoSync){
  refreshFn=RepoSync.startPolling(applyRows,30000);
}else{
  loading=false;loadError=new Error('repo-sync.js not loaded');render();
}
</script>
</body>
</html>
